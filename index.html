<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中學測單字</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --gray-color: #9ca3af;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        /* 頂端功能列 */
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            background-color: #4b5563;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: #374151;
        }

        .btn-sync {
            background-color: #0d9488;
        }
        .btn-sync:hover {
            background-color: #0f766e;
        }

        /* 分類篩選列 */
        .category-filter {
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-filter select {
            flex: 1;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        /* 新增單字表單 */
        .add-card-form {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .add-card-form input, .add-card-form select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }

        .add-card-form button {
            padding: 10px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-card-form button:hover {
            background-color: var(--primary-hover);
        }

        /* 統計與控制列 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #4b5563;
        }

        /* 單字卡本體 */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 250px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #e0e7ff;
            color: #312e81;
        }

        .word {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .badge-container {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .badge {
            background-color: #4f46e5;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .badge-pos {
            background-color: #0d9488;
        }

        .meaning {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .example {
            font-size: 14px;
            color: #6b7280;
            font-style: italic;
        }

        .hint {
            font-size: 12px;
            color: var(--gray-color);
            margin-top: 15px;
        }

        /* 按鈕控制區 */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        .btn-prev, .btn-next {
            background-color: #6b7280;
        }

        .btn-known {
            background-color: #10b981;
        }

        .btn-unknown {
            background-color: #ef4444;
        }

        .controls button:hover {
            opacity: 0.9;
        }

        /* 單字列表區 */
        .word-list {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-height: 220px;
            overflow-y: auto;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
        }

        .word-item:last-child {
            border-bottom: none;
        }

        .word-btn {
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            color: var(--text-color);
            flex: 1;
            padding: 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .word-btn:hover {
            background-color: #f3f4f6;
            color: var(--primary-color);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>高中學測單字</h1>

        <!-- 頂端功能列與同步按鈕 -->
        <div class="top-action-bar">
            <span style="font-size: 13px; color: #4b5563;">資料同步與管理工具</span>
            <div class="btn-group">
                <button class="btn-action btn-sync" onclick="exportData()">匯出資料</button>
                <button class="btn-action btn-sync" onclick="document.getElementById('importFile').click()">匯入資料</button>
                <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
                <button class="btn-action" onclick="loadDefaultWords()">重置預設</button>
            </div>
        </div>

        <!-- 分類篩選列 -->
        <div class="category-filter">
            <label for="categoryFilter" style="font-weight: bold; font-size: 14px;">選擇詞性/種類：</label>
            <select id="categoryFilter" onchange="filterWords()">
                <option value="all">全部詞性/種類 (All)</option>
                <option value="動詞">動詞 (Verb)</option>
                <option value="名詞">名詞 (Noun)</option>
                <option value="形容詞">形容詞 (Adjective)</option>
                <option value="副詞">副詞 (Adverb)</option>
                <option value="片語">片語 (Phrase)</option>
                <option value="轉折詞">轉折詞 (Transition)</option>
            </select>
        </div>

        <!-- 新增單字表單 -->
        <div class="add-card-form">
            <h3>新增自訂單字</h3>
            <input type="text" id="inputWord" placeholder="請輸入單字 (例: environment)">
            <input type="text" id="inputMeaning" placeholder="請輸入中文意思 (例: 環境)">
            <input type="text" id="inputExample" placeholder="請輸入例句 (選填)">
            <select id="inputCategory">
                <option value="動詞">動詞 (Verb)</option>
                <option value="名詞">名詞 (Noun)</option>
                <option value="形容詞">形容詞 (Adjective)</option>
                <option value="副詞">副詞 (Adverb)</option>
                <option value="片語">片語 (Phrase)</option>
                <option value="轉折詞">轉折詞 (Transition)</option>
            </select>
            <button onclick="addWord()">新增到字庫</button>
        </div>

        <!-- 統計資訊 -->
        <div class="stats-bar">
            <span id="cardCount">目前進度: 0 / 0</span>
            <span id="masteryStatus">狀態: 未背熟</span>
        </div>

        <!-- 單字卡 -->
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="badge-container">
                        <span class="badge" id="displayLevel">Level 1</span>
                        <span class="badge badge-pos" id="displayCategory">動詞</span>
                    </div>
                    <div class="word" id="displayWord">載入中...</div>
                    <div class="hint">點擊卡片看中文意思與例句</div>
                </div>
                <div class="card-face card-back">
                    <div class="meaning" id="displayMeaning">請稍候</div>
                    <div class="example" id="displayExample"></div>
                </div>
            </div>
        </div>

        <!-- 控制按鈕 -->
        <div class="controls">
            <button class="btn-prev" onclick="prevCard()">上一張</button>
            <button class="btn-unknown" onclick="markStatus(false)">❌ 未熟</button>
            <button class="btn-known" onclick="markStatus(true)">✔️ 記住了</button>
            <button class="btn-next" onclick="nextCard()">下一張</button>
        </div>

        <!-- 單字列表區 -->
        <div class="word-list">
            <h3>學測單字清單管理（點擊可直接切換）</h3>
            <div id="wordListContainer">
                <!-- 動態生成清單 -->
            </div>
        </div>
    </div>

    <script>
        const defaultCsatWords = [
            { word: "Acknowledge", meaning: "承認；感謝", example: "He acknowledged his mistake.", category: "動詞", level: "Level 1", known: false },
            { word: "Benefit", meaning: "對...有益；獲益", example: "Reading books benefits our minds.", category: "動詞", level: "Level 1", known: false },
            { word: "Calculate", meaning: "計算", example: "Can you calculate the total cost?", category: "動詞", level: "Level 1", known: false },
            { word: "Determine", meaning: "決定；決心", example: "She is determined to pass the exam.", category: "動詞", level: "Level 2", known: false },
            { word: "Generate", meaning: "產生；引起", example: "The solar panels generate electricity.", category: "動詞", level: "Level 3", known: false },
            { word: "Negotiate", meaning: "談判；協商", example: "The two countries agreed to negotiate.", category: "動詞", level: "Level 4", known: false },
            { word: "Participate", meaning: "參與；參加", example: "Everyone is encouraged to participate in the discussion.", category: "動詞", level: "Level 5", known: false },
            { word: "Environment", meaning: "環境", example: "We should protect our natural environment.", category: "名詞", level: "Level 2", known: false },
            { word: "Journal", meaning: "雜誌；期刊；日誌", example: "She keeps a daily journal.", category: "名詞", level: "Level 3", known: false },
            { word: "Technology", meaning: "科技", example: "Modern technology makes our lives easier.", category: "名詞", level: "Level 6", known: false },
            { word: "Obvious", meaning: "明顯的", example: "It was obvious that he was tired.", category: "形容詞", level: "Level 4", known: false },
            { word: "Significant", meaning: "重要的；顯著的", example: "There has been a significant change in weather.", category: "形容詞", level: "Level 5", known: false },
            { word: "Unique", meaning: "獨特的", example: "Every snowflake has a unique shape.", category: "形容詞", level: "Level 6", known: false },
            { word: "Valuable", meaning: "有價值的；寶貴的", example: "Time is more valuable than money.", category: "形容詞", level: "Level 7", known: false },
            { word: "Maximum", meaning: "最大值；最大量的", example: "The maximum speed limit is 100 km/h.", category: "副詞", level: "Level 4", known: false },
            { word: "As a result", meaning: "因此；結果", example: "It rained heavily; as a result, the game was canceled.", category: "片語", level: "Level 3", known: false },
            { word: "In addition", meaning: "此外", example: "In addition, she speaks fluent French.", category: "片語", level: "Level 2", known: false },
            { word: "However", meaning: "然而；不過", example: "He tried hard; however, he failed.", category: "轉折詞", level: "Level 1", known: false },
            { word: "Furthermore", meaning: "此外；再者", example: "The plan is risky. Furthermore, it is too expensive.", category: "轉折詞", level: "Level 4", known: false }
        ];

        let words = JSON.parse(localStorage.getItem('csat_vocabulary_list_v2')) || defaultCsatWords;

        let currentIndex = 0;
        let isFlipped = false;
        let currentFilter = 'all';

        const flashcard = document.getElementById('flashcard');
        const displayWord = document.getElementById('displayWord');
        const displayMeaning = document.getElementById('displayMeaning');
        const displayExample = document.getElementById('displayExample');
        const displayCategory = document.getElementById('displayCategory');
        const displayLevel = document.getElementById('displayLevel');
        const cardCount = document.getElementById('cardCount');
        const masteryStatus = document.getElementById('masteryStatus');
        const wordListContainer = document.getElementById('wordListContainer');
        const categoryFilter = document.getElementById('categoryFilter');

        function getFilteredWords() {
            if (currentFilter === 'all') {
                return words;
            }
            return words.filter(item => item.category === currentFilter);
        }

        function filterWords() {
            currentFilter = categoryFilter.value;
            currentIndex = 0;
            updateCard();
        }

        function updateCard() {
            const filteredWords = getFilteredWords();

            if (filteredWords.length === 0) {
                displayWord.textContent = "目前無此分類單字";
                displayMeaning.textContent = "請自行新增或切換分類";
                displayExample.textContent = "";
                displayCategory.textContent = currentFilter;
                displayLevel.textContent = "自訂";
                cardCount.textContent = "進度: 0 / 0";
                masteryStatus.textContent = "狀態: 無";
                renderWordList();
                return;
            }

            if (currentIndex >= filteredWords.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = filteredWords.length - 1;

            const current = filteredWords[currentIndex];
            displayWord.textContent = current.word;
            displayMeaning.textContent = current.meaning;
            displayExample.textContent = current.example || "";
            displayCategory.textContent = current.category || "動詞";
            displayLevel.textContent = current.level || "Level 1";
            
            cardCount.textContent = `進度: ${currentIndex + 1} / ${filteredWords.length}`;
            masteryStatus.textContent = current.known ? "狀態: 🟢 已記住" : "狀態: 🔴 未背熟";
            
            if (isFlipped) {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }

            renderWordList();
            saveToLocalStorage();
        }

        function flipCard() {
            const filteredWords = getFilteredWords();
            if (filteredWords.length === 0) return;
            flashcard.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function nextCard() {
            const filteredWords = getFilteredWords();
            if (filteredWords.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredWords.length;
            updateCard();
        }

        function prevCard() {
            const filteredWords = getFilteredWords();
            if (filteredWords.length === 0) return;
            currentIndex = (currentIndex - 1 + filteredWords.length) % filteredWords.length;
            updateCard();
        }

        function jumpToWord(wordText) {
            const filteredWords = getFilteredWords();
            const targetIndex = filteredWords.findIndex(w => w.word === wordText);
            if (targetIndex !== -1) {
                currentIndex = targetIndex;
                updateCard();
            }
        }

        function markStatus(status) {
            const filteredWords = getFilteredWords();
            if (filteredWords.length === 0) return;
            
            const targetWord = filteredWords[currentIndex];
            const originalIndex = words.findIndex(w => w.word === targetWord.word);
            if (originalIndex !== -1) {
                words[originalIndex].known = status;
            }

            updateCard();
            if (status && currentIndex < filteredWords.length - 1) {
                nextCard(); 
            }
        }

        function addWord() {
            const wordInput = document.getElementById('inputWord');
            const meaningInput = document.getElementById('inputMeaning');
            const exampleInput = document.getElementById('inputExample');
            const categoryInput = document.getElementById('inputCategory');

            if (!wordInput.value || !meaningInput.value) {
                alert("請至少填寫「單字」與「中文意思」！");
                return;
            }

            words.push({
                word: wordInput.value.trim(),
                meaning: meaningInput.value.trim(),
                example: exampleInput.value.trim(),
                category: categoryInput.value,
                level: "自訂",
                known: false
            });

            wordInput.value = "";
            meaningInput.value = "";
            exampleInput.value = "";

            currentFilter = categoryInput.value;
            categoryFilter.value = currentFilter;
            
            const filteredWords = getFilteredWords();
            currentIndex = filteredWords.length - 1;
            updateCard();
        }

        function deleteWord(wordText) {
            const originalIndex = words.findIndex(w => w.word === wordText);
            if (originalIndex !== -1) {
                words.splice(originalIndex, 1);
            }
            const filteredWords = getFilteredWords();
            if (currentIndex >= filteredWords.length) {
                currentIndex = Math.max(0, filteredWords.length - 1);
            }
            updateCard();
        }

        function loadDefaultWords() {
            if (confirm("確定要重置並載入預設的分類單字庫嗎？")) {
                words = JSON.parse(JSON.stringify(defaultCsatWords));
                currentIndex = 0;
                currentFilter = 'all';
                categoryFilter.value = 'all';
                updateCard();
            }
        }

        /* 📤 匯出資料功能 */
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(words, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "vocab_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        /* 📥 匯入資料功能 */
        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        const importedWords = JSON.parse(e.target.result);
                        if (Array.isArray(importedWords)) {
                            words = importedWords;
                            currentIndex = 0;
                            updateCard();
                            alert("資料匯入成功！");
                        } else {
                            alert("檔案格式錯誤！");
                        }
                    } catch (error) {
                        alert("解析檔案失敗！");
                    }
                };
            }
        }

        function renderWordList() {
            wordListContainer.innerHTML = "";
            const filteredWords = getFilteredWords();
            
            if (filteredWords.length === 0) {
                wordListContainer.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:10px;">此分類目前沒有單字</div>`;
                return;
            }

            filteredWords.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'word-item';
                div.innerHTML = `
                    <button class="word-btn" onclick="jumpToWord('${item.word}')">
                        <strong>[${item.category}]</strong> ${item.word}: ${item.meaning} ${item.known ? '🟢' : '🔴'}
                    </button>
                    <button class="delete-btn" onclick="deleteWord('${item.word}')">刪除</button>
                `;
                wordListContainer.appendChild(div);
            });
        }

        function saveToLocalStorage() {
            localStorage.setItem('csat_vocabulary_list_v2', JSON.stringify(words));
        }

        updateCard();
    </script>
</body>
</html>
