<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測單字記憶卡</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --gray-color: #9ca3af;
            --border-color: #d1d5db;
            --card-back-bg: #e0e7ff;
            --card-back-color: #312e81;
            --item-hover-bg: #f3f4f6;
            --current-item-bg: #eef2ff;
        }

        [data-theme="dark"] {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --gray-color: #6b7280;
            --border-color: #374151;
            --card-back-bg: #312e81;
            --card-back-color: #e0e7ff;
            --item-hover-bg: #374151;
            --current-item-bg: #3730a3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { width: 100%; max-width: 600px; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; }

        .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-action { background-color: #4b5563; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }

        .filter-section { background: var(--card-bg); padding: 12px 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .filter-row { display: flex; align-items: center; gap: 10px; }
        .filter-row select, .filter-row input { flex: 1; padding: 8px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-color); border-radius: 6px; }

        .add-card-form { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .add-card-form input, .add-card-form select { padding: 10px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-color); border-radius: 6px; }
        .add-card-form button { padding: 10px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; }

        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: var(--gray-color); }
        .progress-bar-bg { background: var(--border-color); height: 8px; border-radius: 4px; margin-bottom: 12px; overflow: hidden; }
        #progressBarFill { background: #10b981; height: 100%; width: 0%; transition: width 0.3s; }

        .flashcard-container { perspective: 1000px; width: 100%; height: 250px; margin-bottom: 15px; cursor: pointer; }
        .flashcard { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--card-bg); border-radius: 16px; padding: 20px; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-back { transform: rotateY(180deg); background-color: var(--card-back-bg); color: var(--card-back-color); }
        .word { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .meaning { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .controls button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-prev, .btn-next { background-color: #6b7280; }
        .btn-known { background-color: #10b981; }
        .btn-unknown { background-color: #ef4444; }

        .word-list { background: var(--card-bg); padding: 15px; border-radius: 12px; }
        .word-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--border-color); }
        .word-item.active { background-color: var(--current-item-bg); }
        .word-btn { background: none; border: none; text-align: left; cursor: pointer; color: var(--text-color); flex: 1; padding: 4px; }
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 15px; }
        .page-btn { background-color: var(--border-color); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .page-btn.active { background-color: var(--primary-color); color: white; }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <h1>學測單字記憶卡</h1>

        <div class="top-action-bar">
            <span>資料管理</span>
            <div class="btn-group">
                <button class="btn-action" onclick="toggleTheme()" id="themeToggleBtn">🌙 切換主題</button>
                <button class="btn-action" onclick="exportData()">匯出</button>
                <button class="btn-action" onclick="document.getElementById('importFile').click()">匯入</button>
                <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-row">
                <select id="categoryFilter" onchange="filterWords()">
                    <option value="all">所有詞性</option>
                    <option value="動詞">動詞</option>
                    <option value="名詞">名詞</option>
                    <option value="形容詞">形容詞</option>
                    <option value="副詞">副詞</option>
                    <option value="片語">片語</option>
                </select>
                <input type="text" id="searchInput" placeholder="搜尋單字..." oninput="filterWords()">
            </div>
        </div>

        <div class="add-card-form">
            <h3>➕ 新增單字</h3>
            <input type="text" id="inputWord" placeholder="單字">
            <input type="text" id="inputMeaning" placeholder="中文意思">
            <input type="text" id="inputExample" placeholder="例句">
            <select id="inputCategory">
                <option value="動詞">動詞</option>
                <option value="名詞">名詞</option>
                <option value="形容詞">形容詞</option>
                <option value="副詞">副詞</option>
                <option value="片語">片語</option>
            </select>
            <button onclick="addWord()">加入字庫</button>
        </div>

        <div class="stats-bar">
            <span id="cardCount">進度: 0 / 0</span>
            <span id="percentText">0%</span>
        </div>
        <div class="progress-bar-bg"><div id="progressBarFill"></div></div>

        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="word" id="displayWord">請匯入或新增單字</div>
                </div>
                <div class="card-face card-back">
                    <div class="meaning" id="displayMeaning">內容顯示於此</div>
                    <div id="displayExample"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-prev" onclick="prevCard()">上一張</button>
            <button class="btn-unknown" onclick="markStatus(false)">❌ 未熟</button>
            <button class="btn-known" onclick="markStatus(true)">✔️ 記住了</button>
            <button class="btn-next" onclick="nextCard()">下一張</button>
        </div>

        <div class="word-list">
            <h3>單字清單</h3>
            <div id="wordListContainer"></div>
            <div class="pagination" id="paginationContainer"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'csat_vocabulary_v1';
        const THEME_KEY = 'csat_theme';

        let words = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentIndex = 0;
        let currentPage = 1;
        const itemsPerPage = 5;

        // Initialize Theme
        const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
        document.body.setAttribute('data-theme', savedTheme);

        function getFilteredWords() {
            let cat = document.getElementById('categoryFilter').value;
            let query = document.getElementById('searchInput').value.toLowerCase();
            return words.filter(w => (cat === 'all' || w.category === cat) && (w.word.toLowerCase().includes(query) || w.meaning.includes(query)));
        }

        function updateCard() {
            const filtered = getFilteredWords();
            const display = document.getElementById('flashcard');
            display.classList.remove('flipped');
            
            if (filtered.length === 0) {
                document.getElementById('displayWord').textContent = "無符合項目";
                document.getElementById('displayMeaning').textContent = "";
                document.getElementById('cardCount').textContent = "進度: 0 / 0";
            } else {
                if (currentIndex >= filtered.length) currentIndex = filtered.length - 1;
                const c = filtered[currentIndex];
                document.getElementById('displayWord').textContent = c.word;
                document.getElementById('displayMeaning').textContent = c.meaning;
                document.getElementById('displayExample').textContent = c.example;
                document.getElementById('cardCount').textContent = `進度: ${currentIndex + 1} / ${filtered.length}`;
            }

            const totalKnown = words.filter(w => w.known).length;
            const percent = words.length > 0 ? Math.round((totalKnown / words.length) * 100) : 0;
            document.getElementById('progressBarFill').style.width = percent + "%";
            document.getElementById('percentText').textContent = percent + "%";
            renderList();
        }

        function renderList() {
            const filtered = getFilteredWords();
            const container = document.getElementById('wordListContainer');
            const pagContainer = document.getElementById('paginationContainer');
            container.innerHTML = "";
            pagContainer.innerHTML = "";

            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filtered.slice(start, start + itemsPerPage);

            pageItems.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `word-item ${ (currentIndex === (start + idx)) ? 'active' : '' }`;
                div.innerHTML = `<button class="word-btn" onclick="jumpTo(${start + idx})">${item.word}</button>
                                 <button onclick="deleteWord('${item.word}')">🗑️</button>`;
                container.appendChild(div);
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            for(let i=1; i<=totalPages; i++) {
                const b = document.createElement('button');
                b.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                b.textContent = i;
                b.onclick = () => { currentPage = i; renderList(); };
                pagContainer.appendChild(b);
            }
        }

        function jumpTo(idx) { currentIndex = idx; updateCard(); }
        function filterWords() { currentIndex = 0; currentPage = 1; updateCard(); }
        function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
        function nextCard() { const f = getFilteredWords(); if(currentIndex < f.length - 1) currentIndex++; updateCard(); }
        function prevCard() { if(currentIndex > 0) currentIndex--; updateCard(); }
        
        function addWord() {
            words.push({
                word: document.getElementById('inputWord').value,
                meaning: document.getElementById('inputMeaning').value,
                example: document.getElementById('inputExample').value,
                category: document.getElementById('inputCategory').value,
                known: false
            });
            save(); updateCard();
        }

        function deleteWord(word) {
            words = words.filter(w => w.word !== word);
            save(); updateCard();
        }

        function markStatus(s) { words.find(w => w.word === getFilteredWords()[currentIndex].word).known = s; save(); updateCard(); }
        
        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(words)); }
        
        function toggleTheme() {
            const t = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', t);
            localStorage.setItem(THEME_KEY, t);
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(words)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'vocabulary.json';
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => { words = JSON.parse(e.target.result); save(); updateCard(); };
            reader.readAsText(file);
        }

        updateCard();
    </script>
</body>
</html>
